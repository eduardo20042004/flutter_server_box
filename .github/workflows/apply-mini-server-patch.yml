name: Apply the mini server patch

# One-shot, and it deletes itself in the commit it makes.
#
# This workspace can write a file through the API but not a diff, and the patch
# below touches `lib/l10n/app_en.arb`, which is 9,400 lines: rewriting that file
# through the API would be a copy of it, and a copy that is one line wrong is a
# translation file nobody can use. So the diff travels as a string, and a runner
# with the repository checked out turns it into a commit.
#
# On `push` rather than `workflow_dispatch`: a workflow can only be dispatched
# once GitHub has indexed it, and that happens for the default branch. A push to
# this branch is the event that does not need it indexed first.
#
# The push below uses GITHUB_TOKEN, and GitHub starts no workflow from one of
# those. The build is dispatched by hand after it, which is also what makes the
# two steps visible: the patch lands, then the build is asked for.

on:
  push:
    branches:
      - mini-server-patch
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: arrows801fj
          fetch-depth: 1

      - name: Apply, commit and push
        shell: bash
        env:
          PATCH: ""
        run: |
          set -euo pipefail
          echo "$PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/mini-server.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/mini-server.patch"
          git --no-pager diff --cached --stat
          git rm -q .github/workflows/apply-mini-server-patch.yml
          git config user.name 'ServerBox Arrows build'
          git config user.email 'arrows801fj@users.noreply.github.com'
          git commit -q -F - <<'MSG'
          feat(linux): a local server the device keeps, and starts with the app

          A Linux system on the phone was a shell to type at. It is also a
          computer on a network, and that is the reason to want one: a command
          started once and left running, reachable from every device on the
          same Wi-Fi. Settings > Terminal > Linux gains the server, its
          address, its output and a switch that starts it with the app.

          proot does not virtualise the network, so what the guest binds the
          phone binds. What keeps it alive once the app is backgrounded is the
          foreground service, which is why TermSessionManager counts a running
          local server as a reason to hold one.

          Version 1.0.1926, so a release of it is a version of its own.
          MSG
          git push origin HEAD:arrows801fj
